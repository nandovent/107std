<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Checklists • 107 Studios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--cream:#FCFAE3;--orange:#EF431D;--black:#101010;--coal:#1D1D1D;--muted:#8f8c82;--line:rgba(252,250,227,.13);--danger:#ff7b64}
    *{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--coal)}body{margin:0;font-family:Montserrat,sans-serif;background:var(--coal);color:var(--cream);min-height:100svh;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .app{width:min(980px,100%);margin:auto;padding:max(12px,env(safe-area-inset-top)) 12px max(100px,calc(env(safe-area-inset-bottom) + 88px))}
    .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:max(8px,env(safe-area-inset-top));z-index:20;background:rgba(16,16,16,.92);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:24px;padding:10px 12px;margin-bottom:14px}.brand{height:28px;width:auto}.topbar-copy{min-width:0;flex:1}.topbar small{display:block;color:#aaa89b;font-size:9px;text-transform:uppercase;letter-spacing:.14em;font-weight:800}.topbar strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:#222;color:var(--cream);font-weight:900}.icon-btn:active{transform:scale(.96)}
    .login{min-height:80svh;display:grid;place-items:center}.login-card{width:min(430px,100%);padding:28px;border:1px solid var(--line);border-radius:30px;background:var(--black)}.login-card img{width:130px;margin-bottom:42px}.eyebrow{color:var(--orange);font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:900}.login-card h1{font-size:clamp(42px,12vw,66px);line-height:.83;letter-spacing:-.075em;text-transform:uppercase;margin:14px 0 16px}.login-card p{color:#aaa89b;font-size:13px;line-height:1.5;font-weight:600}.field{width:100%;height:54px;border-radius:16px;border:1px solid var(--line);background:#181818;color:var(--cream);padding:0 16px;outline:none}.field:focus{border-color:var(--orange)}.primary{width:100%;height:54px;border:0;border-radius:16px;background:var(--orange);color:var(--cream);font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-top:10px}.error{color:var(--danger);font-size:12px;font-weight:700;margin-top:10px}
    .section-title{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:22px 4px 12px}.section-title h2{margin:0;font-size:26px;letter-spacing:-.045em}.section-title p{margin:5px 0 0;color:#aaa89b;font-size:12px;font-weight:600}.text-btn{border:0;background:transparent;color:var(--orange);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;padding:8px}
    .template-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.template-card{min-height:132px;border:1px solid var(--line);background:var(--black);color:var(--cream);border-radius:22px;padding:18px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}.template-card .emoji{font-size:28px}.template-card strong{font-size:16px;line-height:1.05}.template-card span:last-child{font-size:10px;color:#aaa89b;font-weight:700}.template-card:active{border-color:var(--orange);transform:scale(.99)}
    .lists{display:grid;gap:10px}.list-card{border:1px solid var(--line);background:var(--black);border-radius:22px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.list-card h3{margin:0 0 6px;font-size:17px}.list-card p{margin:0;color:#aaa89b;font-size:11px;font-weight:700}.progress{height:5px;background:#272727;border-radius:999px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--orange);border-radius:inherit}.list-open{border:0;background:var(--orange);color:white;border-radius:14px;padding:12px 14px;font-size:11px;font-weight:900;text-transform:uppercase}.empty{padding:28px;border:1px dashed var(--line);border-radius:22px;color:#aaa89b;text-align:center;font-size:13px;font-weight:600}
    .sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}.sheet-panel{width:min(980px,100%);margin:auto;background:#151515;border-radius:28px 28px 0 0;border:1px solid var(--line);padding:18px 16px max(22px,env(safe-area-inset-bottom));max-height:88svh;overflow:auto}.grab{width:46px;height:5px;border-radius:999px;background:#444;margin:0 auto 18px}.sheet h3{font-size:24px;margin:0 0 16px;letter-spacing:-.04em}.sheet-actions{display:flex;gap:8px;margin-top:12px}.sheet-actions button{flex:1;height:48px;border-radius:14px;border:1px solid var(--line);background:#222;color:var(--cream);font-weight:800}.sheet-actions .accent{background:var(--orange);border-color:var(--orange)}
    .detail-head{padding:10px 4px 16px}.detail-head .eyebrow{margin-bottom:8px}.detail-head h1{font-size:clamp(34px,10vw,54px);line-height:.9;letter-spacing:-.065em;margin:0 0 12px}.meta-row{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#242424;border:1px solid var(--line);border-radius:999px;padding:8px 10px;font-size:10px;font-weight:800;color:#c9c6b9}.detail-toolbar{display:flex;gap:8px;margin-bottom:12px;overflow:auto;padding-bottom:2px}.detail-toolbar button{white-space:nowrap;border:1px solid var(--line);background:#202020;color:var(--cream);border-radius:14px;padding:11px 13px;font-size:10px;text-transform:uppercase;font-weight:900;letter-spacing:.05em}.detail-toolbar button.danger{color:var(--danger)}
    .items{display:grid;gap:8px}.item{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:4px;min-height:58px;border:1px solid var(--line);background:var(--black);border-radius:18px;padding:6px 8px 6px 6px;transition:.2s}.item.done{opacity:.52;background:#161616}.check{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center}.box{width:25px;height:25px;border:2px solid #777;border-radius:8px;display:grid;place-items:center;font-size:16px;font-weight:900}.done .box{border-color:var(--orange);background:var(--orange);color:white}.item-label{font-size:14px;font-weight:700;line-height:1.25}.done .item-label{text-decoration:line-through;color:#aaa89b}.item-actions{display:flex;align-items:center;gap:2px}.move-btn,.drag{width:34px;height:40px;border:0;background:transparent;color:#777;font-weight:900;border-radius:10px}.move-btn{font-size:17px}.move-btn:active{background:#252525;color:var(--cream)}.move-btn:disabled{opacity:.18}.drag{font-size:20px;touch-action:none}.item.dragging{opacity:.25}@media(max-width:699px){.drag{display:none}.item{grid-template-columns:48px minmax(0,1fr) auto}.move-btn{width:38px;height:44px;font-size:19px}}.divider{display:flex;align-items:center;gap:10px;margin:20px 3px 10px;color:#777;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:900}.divider:after{content:"";height:1px;background:#333;flex:1}
    .addbar{position:fixed;z-index:30;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(956px,calc(100% - 24px));display:flex;gap:8px;padding:8px;border:1px solid var(--line);background:rgba(16,16,16,.94);backdrop-filter:blur(14px);border-radius:20px}.addbar input{flex:1;min-width:0;height:48px;border:0;border-radius:14px;background:#222;color:var(--cream);padding:0 14px;outline:none}.addbar button{width:50px;border:0;border-radius:14px;background:var(--orange);color:white;font-size:24px;font-weight:900}
    .save-state{font-size:10px;color:#aaa89b;font-weight:700}.save-state.bad{color:var(--danger)}
    @media(min-width:700px){.template-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.app{padding-left:20px;padding-right:20px}.topbar{padding-left:18px;padding-right:18px}.list-card{padding:20px}.item-label{font-size:15px}}
  </style>
</head>
<body>
<div id="login" class="login app">
  <div class="login-card">
    <img src="../assets/images/logo-light.png" alt="107 Studios">
    <div class="eyebrow">Área interna</div>
    <h1>Checklist<br>de produção</h1>
    <p>Entre com a mesma senha do painel administrativo.</p>
    <input id="password" class="field" type="password" autocomplete="current-password" placeholder="Senha">
    <button id="loginBtn" class="primary">Entrar</button>
    <div id="loginError" class="error hidden"></div>
  </div>
</div>

<div id="main" class="app hidden">
  <header class="topbar">
    <img class="brand" src="../assets/images/logo-light.png" alt="107 Studios">
    <div class="topbar-copy"><small>107 Studios • interno</small><strong id="topTitle">Checklists</strong></div>
    <span id="saveState" class="save-state"></span>
    <button id="backBtn" class="icon-btn hidden" aria-label="Voltar">←</button>
  </header>

  <div id="homeView">
    <div class="section-title"><div><h2>Nova produção</h2><p>Escolha um modelo e personalize só o que vai levar.</p></div></div>
    <div id="templateGrid" class="template-grid"></div>
    <div class="section-title"><div><h2>Minhas produções</h2><p>Abra a checklist antes de sair.</p></div></div>
    <div id="lists" class="lists"></div>
  </div>

  <div id="detailView" class="hidden">
    <div class="detail-head">
      <div class="eyebrow" id="detailTemplate"></div>
      <h1 id="detailName"></h1>
      <div class="meta-row"><span class="pill" id="detailProgress"></span><span class="pill" id="detailDate"></span></div>
    </div>
    <div class="detail-toolbar">
      <button id="renameBtn">Renomear</button><button id="resetBtn">Desmarcar tudo</button><button id="copyLinkBtn">Copiar link</button><button id="deleteBtn" class="danger">Excluir</button>
    </div>
    <div id="pendingItems" class="items"></div>
    <div id="doneWrap" class="hidden"><div class="divider">Concluídos</div><div id="doneItems" class="items"></div></div>
    <div class="addbar"><input id="newItem" placeholder="Adicionar item…"><button id="addItemBtn" aria-label="Adicionar">+</button></div>
  </div>
</div>

<div id="sheet" class="sheet hidden"><div class="sheet-panel"><div class="grab"></div><h3 id="sheetTitle">Nova produção</h3><input id="sheetInput" class="field" placeholder="Nome da produção"><div class="sheet-actions"><button id="sheetCancel">Cancelar</button><button id="sheetConfirm" class="accent">Criar</button></div></div></div>

<script>
(()=>{
  const $=s=>document.querySelector(s), uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
  const state={password:sessionStorage.getItem('107-checklist-password')||'',data:null,current:null,template:null,saving:false};
  const login=$('#login'), main=$('#main'), home=$('#homeView'), detail=$('#detailView');
  const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  async function api(method='GET'){
    const r=await fetch('/api/checklists',{method,headers:{'Content-Type':'application/json','x-admin-password':state.password},body:method==='PUT'?JSON.stringify(state.data):undefined,cache:'no-store'});
    if(r.status===401) throw new Error('Senha incorreta.');
    if(!r.ok){const x=await r.json().catch(()=>({}));throw new Error(x.error||'Erro ao acessar as checklists.')}return r.json();
  }
  function showSave(text,bad=false){const e=$('#saveState');e.textContent=text;e.classList.toggle('bad',bad)}
  let saveTimer; function queueSave(){clearTimeout(saveTimer);showSave('salvando…');saveTimer=setTimeout(save,350)}
  async function save(){if(state.saving)return;state.saving=true;try{await api('PUT');showSave('salvo')}catch(e){showSave('erro ao salvar',true)}finally{state.saving=false}}
  async function enter(){state.password=$('#password').value||state.password;$('#loginError').classList.add('hidden');try{state.data=await api();sessionStorage.setItem('107-checklist-password',state.password);login.classList.add('hidden');main.classList.remove('hidden');renderHome();openFromUrl()}catch(e){$('#loginError').textContent=e.message;$('#loginError').classList.remove('hidden')}}
  $('#loginBtn').onclick=enter;$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});if(state.password)enter();
  function normalizeList(l){l.items=(l.items||[]).map((x,i)=>typeof x==='string'?{id:uid(),text:x,done:false,order:i}:x);return l}
  function renderHome(){state.data.lists=(state.data.lists||[]).map(normalizeList);$('#topTitle').textContent='Checklists';$('#backBtn').classList.add('hidden');home.classList.remove('hidden');detail.classList.add('hidden');
    $('#templateGrid').innerHTML=(state.data.templates||[]).map(t=>`<button class="template-card" data-template="${esc(t.id)}"><span class="emoji">${esc(t.icon||'✓')}</span><strong>${esc(t.name)}</strong><span>${(t.items||[]).length} itens</span></button>`).join('');
    document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>newList(b.dataset.template));
    const lists=(state.data.lists||[]).slice().sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));$('#lists').innerHTML=lists.length?lists.map(l=>{const done=l.items.filter(i=>i.done).length,total=l.items.length,p=total?Math.round(done/total*100):0;return `<div class="list-card"><div><h3>${esc(l.name)}</h3><p>${done}/${total} itens • ${esc(l.templateName||'Personalizada')}</p><div class="progress"><i style="width:${p}%"></i></div></div><button class="list-open" data-open="${esc(l.id)}">Abrir</button></div>`}).join(''):'<div class="empty">Nenhuma produção criada ainda.</div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openList(b.dataset.open));}
  function newList(templateId){state.template=(state.data.templates||[]).find(t=>t.id===templateId);if(!state.template)return;$('#sheetTitle').textContent=state.template.name;$('#sheetInput').value='';$('#sheetConfirm').textContent='Criar';$('#sheet').classList.remove('hidden');setTimeout(()=>$('#sheetInput').focus(),50)}
  $('#sheetCancel').onclick=()=>$('#sheet').classList.add('hidden');$('#sheet').onclick=e=>{if(e.target.id==='sheet')$('#sheet').classList.add('hidden')};
  $('#sheetConfirm').onclick=()=>{const name=$('#sheetInput').value.trim();if(!name)return $('#sheetInput').focus();if(state.current&&state.template===null){state.current.name=name;state.current.updatedAt=new Date().toISOString();$('#sheet').classList.add('hidden');renderDetail();queueSave();return}const t=state.template,l={id:uid(),name,templateId:t.id,templateName:t.name,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),items:(t.items||[]).map((text,i)=>({id:uid(),text,done:false,order:i}))};state.data.lists.push(l);$('#sheet').classList.add('hidden');queueSave();openList(l.id)};
  function openList(id,push=true){const l=(state.data.lists||[]).find(x=>x.id===id);if(!l)return;state.current=normalizeList(l);home.classList.add('hidden');detail.classList.remove('hidden');$('#backBtn').classList.remove('hidden');if(push)history.replaceState(null,'',location.pathname+'?list='+encodeURIComponent(id));renderDetail()}
  function openFromUrl(){const id=new URLSearchParams(location.search).get('list');if(id)openList(id,false)}
  $('#backBtn').onclick=()=>{history.replaceState(null,'',location.pathname);state.current=null;renderHome()};
  function renderDetail(){const l=state.current;if(!l)return;$('#topTitle').textContent=l.name;$('#detailTemplate').textContent=l.templateName||'Checklist';$('#detailName').textContent=l.name;const done=l.items.filter(i=>i.done).length;$('#detailProgress').textContent=`${done} de ${l.items.length} concluídos`;$('#detailDate').textContent=new Date(l.createdAt).toLocaleDateString('pt-BR');const pending=l.items.filter(i=>!i.done).sort((a,b)=>a.order-b.order),completed=l.items.filter(i=>i.done).sort((a,b)=>a.order-b.order);$('#pendingItems').innerHTML=pending.map(itemHtml).join('');$('#doneItems').innerHTML=completed.map(itemHtml).join('');$('#doneWrap').classList.toggle('hidden',!completed.length);bindItems()}
  function itemHtml(i){return `<div class="item ${i.done?'done':''}" draggable="true" data-id="${esc(i.id)}"><button class="check" aria-label="${i.done?'Desmarcar':'Marcar'}"><span class="box">${i.done?'✓':''}</span></button><div class="item-label">${esc(i.text)}</div><div class="item-actions"><button class="move-btn move-up" aria-label="Subir item">↑</button><button class="move-btn move-down" aria-label="Descer item">↓</button><button class="drag" aria-label="Arrastar para reordenar">≡</button></div></div>`}
  function bindItems(){document.querySelectorAll('.item').forEach(el=>{const item=()=>state.current.items.find(i=>i.id===el.dataset.id);const current=item();const peers=state.current.items.filter(i=>i.done===current.done).sort((a,b)=>a.order-b.order);const idx=peers.findIndex(i=>i.id===current.id);const up=el.querySelector('.move-up'),down=el.querySelector('.move-down');up.disabled=idx<=0;down.disabled=idx<0||idx>=peers.length-1;up.onclick=()=>moveItem(current,-1);down.onclick=()=>moveItem(current,1);el.querySelector('.check').onclick=()=>{const i=item();i.done=!i.done;i.order=maxOrder(i.done)+1;touch();renderDetail();queueSave()};el.querySelector('.item-label').ondblclick=()=>editItem(item());el.addEventListener('dragstart',()=>el.classList.add('dragging'));el.addEventListener('dragend',()=>{el.classList.remove('dragging');syncOrderFromDom(el.closest('.items'));queueSave()})});document.querySelectorAll('.items').forEach(list=>{list.ondragover=e=>{e.preventDefault();const dragging=document.querySelector('.dragging');if(!dragging||dragging.closest('.items')!==list)return;const after=[...list.querySelectorAll('.item:not(.dragging)')].find(x=>e.clientY<=x.getBoundingClientRect().top+x.offsetHeight/2);after?list.insertBefore(dragging,after):list.appendChild(dragging)}})}
  function moveItem(item,dir){const peers=state.current.items.filter(i=>i.done===item.done).sort((a,b)=>a.order-b.order);const idx=peers.findIndex(i=>i.id===item.id),target=peers[idx+dir];if(!target)return;const old=item.order;item.order=target.order;target.order=old;touch();renderDetail();queueSave()}
  function syncOrderFromDom(container){[...container.children].forEach((el,idx)=>{const i=state.current.items.find(x=>x.id===el.dataset.id);if(i)i.order=idx});touch()}
  function maxOrder(done){return Math.max(-1,...state.current.items.filter(i=>i.done===done).map(i=>Number(i.order)||0))}
  function touch(){state.current.updatedAt=new Date().toISOString()}
  function addItem(){const text=$('#newItem').value.trim();if(!text)return;state.current.items.push({id:uid(),text,done:false,order:maxOrder(false)+1});$('#newItem').value='';touch();renderDetail();queueSave()}
  $('#addItemBtn').onclick=addItem;$('#newItem').addEventListener('keydown',e=>{if(e.key==='Enter')addItem()});
  function editItem(i){const text=prompt('Editar item',i.text);if(text===null)return;if(!text.trim()){if(confirm('Excluir este item?'))state.current.items=state.current.items.filter(x=>x.id!==i.id)}else i.text=text.trim();touch();renderDetail();queueSave()}
  $('#resetBtn').onclick=()=>{if(!confirm('Desmarcar todos os itens desta produção?'))return;state.current.items.forEach((i,idx)=>{i.done=false;i.order=idx});touch();renderDetail();queueSave()};
  $('#renameBtn').onclick=()=>{state.template=null;$('#sheetTitle').textContent='Renomear produção';$('#sheetInput').value=state.current.name;$('#sheetConfirm').textContent='Salvar';$('#sheet').classList.remove('hidden');setTimeout(()=>$('#sheetInput').focus(),50)};
  $('#deleteBtn').onclick=()=>{if(!confirm(`Excluir a checklist “${state.current.name}”?`))return;state.data.lists=state.data.lists.filter(x=>x.id!==state.current.id);state.current=null;queueSave();history.replaceState(null,'',location.pathname);renderHome()};
  $('#copyLinkBtn').onclick=async()=>{const url=location.origin+location.pathname+'?list='+encodeURIComponent(state.current.id);try{await navigator.clipboard.writeText(url);const b=$('#copyLinkBtn'),old=b.textContent;b.textContent='Link copiado';setTimeout(()=>b.textContent=old,1400)}catch(e){prompt('Copie o link:',url)}};
})();
</script>
</body>
</html>
